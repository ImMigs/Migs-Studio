<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/img/projects/countdown/icons/icon-rev.jpg">
    <title>Resident Evil Veronica | Countdown</title>

    <!-- #region // OPEN GRAPH -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://migs-studio.com.br/projects/countdown/residentevilveronica">
    <meta property="og:title" content="Resident Evil Veronica | Countdown">
    <meta property="og:description"
        content="A countdown to Resident Evil Veronica, the newest game of the franchise created by Capcom. Releasing in 2027.">
    <meta property="og:image"
        content="https://www.migs-studio.com.br/assets/img/projects/countdown/banners/banner-rev.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://migs-studio.com.br/projects/countdown/residentevilveronica">
    <meta name="twitter:title" content="Resident Evil Veronica | Countdown">
    <meta name="twitter:description"
        content="A countdown to Resident Evil Veronica, the newest game of the franchise created by Capcom. Releasing in 2027.">
    <meta name="twitter:image"
        content="https://www.migs-studio.com.br/assets/img/projects/countdown/banners/banner-rev.png">
    <!-- #endregion -->

    <!-- #region // CSS -->
    <link rel="stylesheet" href="/assets/css/global/base.css">
    <link rel="stylesheet" href="/assets/css/global/subnavbar.css">

    <link rel="stylesheet" href="/assets/css/projects/countdown/style.css">
    <link rel="stylesheet" href="/assets/css/projects/countdown/responsive.css">
    <!-- #endregion -->

    <!-- #region // FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/161ec40ef8.js" crossorigin="anonymous"></script>
    <!-- #endregion -->

    <!-- #region // BACKGROUND -->
    <style>
        body::before {
            background-image: url('/assets/img/projects/countdown/backgrounds/background-rev.jpg');
        }
    </style>
    <!-- #endregion -->
</head>

<body>
    <!-- #region // SUBNAVBAR -->
    <div class="subnavbar">
        <div id="subnavbar-background"></div>
        <a href="/" target="_self"><img src="/assets/img/global/logo_alt.png" alt="logo" class="logo_alt"></a>
        <ul class="subnavbar-left">
            <li class="subnavbar-item"><a href="https://www.residentevil.com/veronica/" target="_blank"
                    data-i18n="countdown_website"></a></li>
            <li class="subnavbar-item"><a href="https://youtu.be/uxUMXniTfjM?si=OHKSHX4-j40Q3-TZ"
                    target="_blank">Trailer 1</a></li>
        </ul>

        <div class="subnavbar-right">
            <button id="button-lang">🌐</button>
            <!-- <button id="button-audio">🔇</button>-->
        </div>
    </div>
    <!-- #endregion -->

    <!-- #region // TIMER -->
    <div class="timers-wrapper">
        <div class="timer-group">
            <img src="/assets/img/projects/countdown/logos/logo-rev.webp" class="countdown-logo" id="countdown-logo-rev"
                alt="logo">
            <div class="container">
                <div id="timer">2027</div>
            </div>
        </div>

        <div class="scroll-down-wrapper">
            <a href="#last-news" class="scroll-down-btn" onclick="showLastNews(event)">
                <span data-i18n="countdown_news_title">-</span> <i class="fa-solid fa-chevron-down"></i>
            </a>
        </div>
    </div>
    <!-- #endregion -->

    <!-- #region // NEWS HISTORY -->
    <div id="last-news" class="news-section">
        <a href="#" class="scroll-up-btn" onclick="hideLastNews(event)">
            <i class="fa-solid fa-chevron-up"></i> <span data-i18n="countdown_back">-</span>
        </a>
        <h2 data-i18n="countdown_news_title">-</h2>

        <div class="news-container">
            <!-- NEWS #3 | Gamescom x Capcom -->
            <a target="_blank" href="https://x.com/CapcomEurope/status/2065449296124600601">
                <div class="news-item">
                    <img src="/assets/img/projects/countdown/icons/rev_news_3.jpg" alt="News Image" class="news-image">

                    <div class="news-content">
                        <span class="news-date" data-i18n="countdown_rev_news_3_title">-</span>
                        <p class="news-text" data-i18n="countdown_rev_news_3_content">-</p>
                    </div>
                </div>
            </a>

            <!-- NEWS #2 | Interview -->
            <a target="_blank" href="https://youtu.be/Nt6mVYnXaHk?si=x4OjJIcmf5Q0TW_L">
                <div class="news-item">
                    <img src="/assets/img/projects/countdown/icons/rev_news_2.webp" alt="News Image" class="news-image">

                    <div class="news-content">
                        <span class="news-date" data-i18n="countdown_rev_news_2_title">-</span>
                        <p class="news-text" data-i18n="countdown_rev_news_2_content">-</p>
                    </div>
                </div>
            </a>

            <!-- NEWS #1 | Announcement Trailer -->
            <a target="_blank" href="https://youtu.be/uxUMXniTfjM?si=OHKSHX4-j40Q3-TZ">
                <div class="news-item">
                    <img src="/assets/img/projects/countdown/icons/rev_news_1.jpg" alt="News Image" class="news-image">

                    <div class="news-content">
                        <span class="news-date" data-i18n="countdown_rev_news_1_title">-</span>
                        <p class="news-text" data-i18n="countdown_rev_news_1_content">-</p>
                    </div>
                </div>
            </a>

        </div>
    </div>

    <!-- #endregion -->

    <!-- #region // AUDIO SETUP -->
    <script>
        // window.customAudioPath = '/assets/audios/projetos/countdown/audio_rev.mp3';
    </script>
    <!-- #endregion -->

    <!-- #region // TIMER SETUP -->
    <script src="/assets/js/projects/countdown/countdown.js"></script>
    <script>
        // const targetDate = new Date(Date.UTC(2027, 10, 0, 0, 0, 0));
        // new CountdownTimer(targetDate, 'timer');
    </script>
    <!-- #endregion -->

    <script src="/assets/js/core/base.js"></script>
</body>
