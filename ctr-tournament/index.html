    <!-- #region // GOOGLE LOGIN -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            // Decodifica o payload do token JWT para obter os dados do usuário (nome, foto, email)
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const payload = JSON.parse(jsonPayload);

            // Oculta o botão do Google e exibe a foto do usuário
            document.getElementById('google-login-btn').style.display = 'none';
            
            const userProfilePic = document.getElementById('user-profile-pic');
            userProfilePic.src = payload.picture;
            userProfilePic.title = payload.name; // Exibe o nome do usuário ao passar o mouse por cima
            userProfilePic.style.display = 'block';
        }

        window.addEventListener('load', function () {
            google.accounts.id.initialize({
                client_id: "SEU_CLIENT_ID_AQUI.apps.googleusercontent.com", // IMPORTANTE: Substitua pelo seu Client ID real
                callback: handleCredentialResponse
            });

            // Renderiza o botão oficial do Google com formato circular (ícone)
            google.accounts.id.renderButton(
                document.getElementById("google-login-btn"),
                { theme: "outline", size: "large", type: "icon", shape: "circle" }
            );
        });
    </script>
    <!-- #endregion -->
